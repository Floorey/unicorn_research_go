{{ define "sector_hedge_content" }}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    <!-- Sidebar: Saved Labs -->
    <div class="lg:col-span-1">
        <div id="dashboard-list-container" class="glass-panel p-6">
            <div class="flex items-center space-x-2 border-b border-cyan-500/30 pb-4 mb-4">
                <div class="w-2 h-2 bg-cyan-500 animate-pulse rounded-full shadow-[0_0_8px_cyan]"></div>
                <h2 class="text-sm font-bold tracking-widest text-cyan-400 uppercase">Hedge Archives</h2>
            </div>
            {{ template "sector_hedge_dashboard_list.html" . }}
        </div>
    </div>

    <!-- Form Section -->
    <div class="lg:col-span-1">
        <div class="glass-panel p-6">
            <div id="sector-hedge-form-container">
                {{ template "sector_hedge_form.html" . }}
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div class="lg:col-span-2">
        <div id="results-container" class="min-h-[600px]">
            <div class="flex flex-col items-center justify-center h-full glass-panel border-dashed border-cyan-500/20 p-24 text-center">
                <div class="p-6 bg-cyan-500/5 rounded-full shadow-[0_0_30px_rgba(0,210,255,0.1)] mb-6 border border-cyan-500/20 animate-pulse-slow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                </div>
                <p class="text-lg font-bold text-cyan-100 uppercase tracking-[0.2em] neon-text">Alpha Core Ready</p>
                <p class="mt-4 text-[10px] text-cyan-500/70 uppercase tracking-widest leading-relaxed max-w-sm mx-auto">
                    Configure target assets and hedge vectors to initiate idiosyncratic risk analysis.
                </p>
            </div>
        </div>
    </div>
</div>
{{ end }}
