{{ define "content" }}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    <!-- Form Section -->
    <div class="lg:col-span-1">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-semibold mb-6 text-slate-800 border-b pb-2">Sector Hedge Strategy</h2>
            <form hx-post="/ui/simulate/sector-hedge" 
                  hx-target="#results-container" 
                  hx-indicator="#loading"
                  class="space-y-4">
                
                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-indigo-600 uppercase tracking-widest">Market Context</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Index Vol (%)</label>
                            <input type="number" name="index_vol" value="18" class="w-full p-2 border border-slate-200 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Risk Free (%)</label>
                            <input type="number" name="risk_free_rate" value="4" class="w-full p-2 border border-slate-200 rounded text-sm">
                        </div>
                    </div>
                </div>

                <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold text-indigo-600 uppercase tracking-widest">Single Stock Positions</h3>
                    {{ range $i := (seq 1 3) }}
                    <div class="p-3 bg-slate-50 rounded-lg border border-slate-100 space-y-2">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="col-span-1">
                                <label class="block text-[9px] font-bold text-slate-400 uppercase">Value</label>
                                <input type="number" name="pos_{{ $i }}" value="5000" class="w-full p-1 border border-slate-200 rounded text-xs">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase">Beta</label>
                                <input type="number" name="beta_{{ $i }}" value="1.2" step="0.1" class="w-full p-1 border border-slate-200 rounded text-xs">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase">Idio Vol</label>
                                <input type="number" name="vol_{{ $i }}" value="0.25" step="0.01" class="w-full p-1 border border-slate-200 rounded text-xs">
                            </div>
                        </div>
                    </div>
                    {{ end }}
                </div>

                <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold text-indigo-600 uppercase tracking-widest">Hedge & Options</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Short Index (€)</label>
                            <input type="number" name="short_index_pos" value="15000" class="w-full p-2 border border-slate-200 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Opt Strike</label>
                            <input type="number" name="option_strike" value="105" class="w-full p-2 border border-slate-200 rounded text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Opt Qty</label>
                            <input type="number" name="option_quantity" value="100" class="w-full p-2 border border-slate-200 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase">Opt Expiry (Yr)</label>
                            <input type="number" name="option_expiry" value="1" step="0.1" class="w-full p-2 border border-slate-200 rounded text-sm">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-100">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Duration (Yrs)</label>
                        <input type="number" name="duration_years" value="1" class="w-full p-2 border border-slate-300 rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase mb-1">Paths</label>
                        <input type="number" name="num_paths" value="5000" class="w-full p-2 border border-slate-300 rounded text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md transition-all flex justify-center items-center">
                    Analyze Strategy
                    <span id="loading" class="htmx-indicator ml-3">
                        <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <!-- Results Section -->
    <div class="lg:col-span-3">
        <div id="results-container" class="min-h-[600px]">
            <div class="flex flex-col items-center justify-center h-full bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl p-24 text-slate-400 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-24 mb-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20.488 9H15V1.512A9.025 9.001 0 0120.488 9z" />
                </svg>
                <p class="text-xl font-semibold">Sector Hedge Analysis</p>
                <p class="mt-2">Simulate Alpha vs. Beta performance with option leverage.</p>
            </div>
        </div>
    </div>
</div>
{{ end }}
