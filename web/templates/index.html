{{ define "content" }}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    <!-- Sidebar: Saved Scenarios -->
    <div class="lg:col-span-1">
        <div id="dashboard-list-container" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            {{ template "dashboard_list.html" . }}
        </div>
    </div>

    <!-- Main Content: Simulator -->
    <div class="lg:col-span-1">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-xl font-semibold mb-6 text-slate-800 border-b pb-2">Simulation Parameters</h2>
            <div id="simulator-form-container">
                {{ template "simulator_form.html" . }}
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div class="lg:col-span-2">
        <div id="results-container" class="min-h-[400px]">
            <div class="flex flex-col items-center justify-center h-full bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl p-12 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <p class="text-lg font-medium">Ready to calculate risk.</p>
                <p class="text-sm">Adjust parameters or load a saved scenario to begin.</p>
            </div>
        </div>
    </div>
</div>
{{ end }}
