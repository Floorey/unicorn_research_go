{{ define "macro_content" }}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    <!-- Sidebar: Saved Scenarios -->
    <div class="lg:col-span-1">
        <div id="dashboard-list-container" class="glass-panel p-6">
            <div class="flex items-center space-x-2 border-b border-cyan-500/30 pb-4 mb-4">
                <div class="w-2 h-2 bg-cyan-500 animate-pulse rounded-full shadow-[0_0_8px_cyan]"></div>
                <h2 class="text-sm font-bold tracking-widest text-cyan-400 uppercase">Archives</h2>
            </div>
            {{ template "dashboard_list.html" . }}
        </div>
    </div>

    <!-- Main Content: Simulator -->
    <div class="lg:col-span-1">
        <div class="glass-panel p-6">
            <div id="simulator-form-container">
                {{ template "simulator_form.html" . }}
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div class="lg:col-span-2">
        <div id="results-container" class="min-h-[400px]">
            <div class="flex flex-col items-center justify-center h-full glass-panel border-dashed border-cyan-500/20 p-12 text-center">
                <div class="p-6 bg-cyan-500/5 rounded-full shadow-[0_0_30px_rgba(0,210,255,0.1)] mb-6 border border-cyan-500/20 animate-pulse-slow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <p class="text-lg font-bold text-cyan-100 uppercase tracking-[0.2em] neon-text">Neural Core Ready</p>
                <p class="mt-4 text-[10px] text-cyan-500/70 uppercase tracking-widest leading-relaxed max-w-sm mx-auto">
                    Awaiting vector input. Load an archived scenario or manually configure parameters to initiate simulation.
                </p>
                <div class="mt-8 flex space-x-2">
                    <div class="w-1 h-1 bg-cyan-500 rounded-full"></div>
                    <div class="w-1 h-1 bg-cyan-500 rounded-full animate-ping"></div>
                    <div class="w-1 h-1 bg-cyan-500 rounded-full"></div>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
