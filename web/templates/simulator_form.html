<form hx-post="/ui/simulate" 
      hx-target="#results-container" 
      hx-indicator="#loading"
      id="simulator-form"
      class="space-y-6">
    
    <div class="flex items-center space-x-2 border-b border-cyan-500/30 pb-4 mb-4">
        <div class="w-2 h-2 bg-cyan-500 animate-pulse rounded-full shadow-[0_0_8px_cyan]"></div>
        <h2 class="text-sm font-bold tracking-widest text-cyan-400 uppercase">Input Parameters</h2>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-[10px] font-bold text-cyan-500/60 uppercase tracking-tighter mb-1">Int. Rate (%)</label>
            <input type="number" name="interest_rate" value="{{ if .Dash }}{{ .Dash.InterestRate }}{{ else }}4.25{{ end }}" step="0.01" class="w-full glass-input text-sm">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-cyan-500/60 uppercase tracking-tighter mb-1">Oil Price ($)</label>
            <input type="number" name="oil_price" value="{{ if .Dash }}{{ .Dash.OilPrice }}{{ else }}82.50{{ end }}" step="0.01" class="w-full glass-input text-sm">
        </div>
    </div>

    <div class="space-y-4 pt-2">
        <h3 class="text-[10px] font-black text-cyan-400 uppercase tracking-widest border-l-2 border-cyan-500 pl-2">Portfolio Positions (€)</h3>
        <div class="grid grid-cols-2 gap-4">
            <div class="relative group">
                <label class="block text-[9px] text-cyan-500/60 uppercase absolute -top-2 left-2 px-1 bg-[#0a0e14]/80 font-bold tracking-tighter group-focus-within:text-cyan-400 transition-colors">Tech</label>
                <input type="number" name="pos_a_tech" value="{{ if .Dash }}{{ .Dash.PosATech }}{{ else }}3000{{ end }}" class="w-full glass-input pt-3 text-sm">
            </div>
            <div class="relative group">
                <label class="block text-[9px] text-cyan-500/60 uppercase absolute -top-2 left-2 px-1 bg-[#0a0e14]/80 font-bold tracking-tighter group-focus-within:text-cyan-400 transition-colors">Energy</label>
                <input type="number" name="pos_b_energy" value="{{ if .Dash }}{{ .Dash.PosBEnergy }}{{ else }}2000{{ end }}" class="w-full glass-input pt-3 text-sm">
            </div>
            <div class="relative group">
                <label class="block text-[9px] text-cyan-500/60 uppercase absolute -top-2 left-2 px-1 bg-[#0a0e14]/80 font-bold tracking-tighter group-focus-within:text-cyan-400 transition-colors">Bonds</label>
                <input type="number" name="pos_c_bonds" value="{{ if .Dash }}{{ .Dash.PosCBonds }}{{ else }}5000{{ end }}" class="w-full glass-input pt-3 text-sm">
            </div>
            <div class="relative group">
                <label class="block text-[9px] text-cyan-500/60 uppercase absolute -top-2 left-2 px-1 bg-[#0a0e14]/80 font-bold tracking-tighter group-focus-within:text-cyan-400 transition-colors">Crypto</label>
                <input type="number" name="pos_d_crypto" value="{{ if .Dash }}{{ .Dash.PosDCrypto }}{{ else }}1000{{ end }}" class="w-full glass-input pt-3 text-sm">
            </div>
            <div class="col-span-2 relative group">
                <label class="block text-[9px] text-cyan-500/60 uppercase absolute -top-2 left-2 px-1 bg-[#0a0e14]/80 font-bold tracking-tighter group-focus-within:text-cyan-400 transition-colors">Gold</label>
                <input type="number" name="pos_e_gold" value="{{ if .Dash }}{{ .Dash.PosEGold }}{{ else }}1500{{ end }}" class="w-full glass-input pt-3 text-sm">
            </div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 pt-4 border-t border-cyan-500/20">
        <div>
            <label class="block text-[10px] font-bold text-cyan-500/60 uppercase tracking-tighter mb-1">Duration (Y)</label>
            <input type="number" name="duration_years" value="{{ if .Dash }}{{ .Dash.DurationYears }}{{ else }}5{{ end }}" class="w-full glass-input text-sm">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-cyan-500/60 uppercase tracking-tighter mb-1">Paths</label>
            <input type="number" name="num_paths" value="{{ if .Dash }}{{ .Dash.NumPaths }}{{ else }}1000{{ end }}" class="w-full glass-input text-sm">
        </div>
    </div>

    <div class="flex flex-col gap-3 pt-4">
        <button type="submit" class="w-full jarvis-button py-3 text-sm active:scale-95 flex justify-center items-center group">
            <span class="group-hover:neon-accent transition-all">Initiate Monte Carlo</span>
            <span id="loading" class="htmx-indicator ml-3">
                <svg class="animate-spin h-4 w-4 text-cyan-400" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
        </button>
        <div class="flex justify-between items-center px-1">
             <div class="flex space-x-1">
                <div class="h-1 w-3 rounded-full bg-cyan-500"></div>
                <div class="h-1 w-3 rounded-full bg-cyan-500"></div>
                <div class="h-1 w-3 rounded-full bg-cyan-900"></div>
            </div>
            <span class="text-[8px] text-cyan-500/40 font-mono tracking-widest uppercase">Kernel Ready</span>
        </div>
    </div>
</form>
