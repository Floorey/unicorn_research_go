<div class="space-y-3">
    {{ if not .Dashboards }}
    <p class="text-[10px] text-cyan-500/30 uppercase tracking-widest italic text-center py-4">No Data Logged</p>
    {{ end }}
    {{ range .Dashboards }}
    <div hx-get="/ui/dashboards/{{ .ID }}" 
         hx-target="#simulator-form-container"
         class="w-full text-left p-3 border border-cyan-500/10 rounded-md bg-slate-950/20 hover:bg-cyan-500/10 hover:border-cyan-500/40 transition-all group cursor-pointer">
        <div class="flex justify-between items-center mb-1">
            <span class="text-[11px] font-bold text-cyan-200 uppercase tracking-tighter group-hover:text-cyan-100 transition-colors">{{ .Name }}</span>
            <span class="text-[9px] text-cyan-500/40 font-mono">{{ .CreatedAt.Format "02.01.06" }}</span>
        </div>
        <div class="flex items-center space-x-2">
            <div class="h-[1px] flex-grow bg-cyan-500/10"></div>
            <span class="text-[8px] text-cyan-500/30 uppercase font-mono tracking-widest">Load Vector</span>
        </div>
    </div>
    {{ end }}
</div>
